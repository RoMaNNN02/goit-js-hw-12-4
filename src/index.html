<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="timer" id="timer-1">
      <div class="field">
        <span class="value" data-value="days"></span>
        <span class="label"></span>
      </div>
      <div class="field">
        <span class="value" data-value="hours"></span>
        <span class="label"></span>
      </div>
      <div class="field">
        <span class="value" data-value="mins"></span>
        <span class="label"></span>
      </div>
      <div class="field">
        <span class="value" data-value="secs"></span>
        <span class="label"></span>
      </div>
    </div>
    <div class="controls-container">
      <button class="button-1">start</button>
      <button class="button-2">stop</button>
      <button class="button-3">pause</button>
    </div>
    <script src="./js/index.js" type="module"></script>
  </body>
</html>
